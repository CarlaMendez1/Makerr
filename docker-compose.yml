version: '3.8'

services:

  api:
    build: .
    container_name: app_node_tp5
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=gimnasio_db
      - DB_PORT=5432


  db:
    image: postgres:15-alpine
    container_name: bd_postgres_tp5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gimnasio_db
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: